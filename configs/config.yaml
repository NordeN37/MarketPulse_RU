# MarketPulse_RU Configuration

app:
  name: "MarketPulse_RU"
  env: "development"  # development, production
  log_level: "info"   # debug, info, warn, error

database:
  host: "localhost"
  port: 5432
  user: "marketpulse"
  password: "marketpulse"
  name: "marketpulse"
  sslmode: "disable"
  max_open_conns: 25
  max_idle_conns: 5

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

telegram:
  # MTProto userbot credentials (from https://my.telegram.org)
  # The userbot subscribes to public channels as a regular user
  api_id: ${TELEGRAM_API_ID:-0}
  api_hash: "${TELEGRAM_API_HASH}"
  phone: "${TELEGRAM_PHONE}"
  # Channels to monitor (userbot joins them automatically)
  channels:
    - "@smartlabnews"
    - "@markettwits"
    - "@moex_news"
    - "@cbr_news"
    - "@interfax_news"
    - "@rbc_news"
    - "@vedomosti"
    - "@forbes_russia"
  # Bot token for SENDING alerts (separate from userbot)
  bot_token: "${TELEGRAM_BOT_TOKEN}"
  alert_chat_id: ${TELEGRAM_ALERT_CHAT_ID:-0}

llm:
  # Fast model for routine tasks (classify, NER, sentiment) — ~80% of load
  # Qwen3-8B ≈ Qwen2.5-14B quality, ~5GB RAM
  ollama:
    base_url: "http://localhost:11434"
    model: "qwen3:8b"
    timeout_seconds: 60
    thinking: false  # disable thinking for fast JSON extraction

  # Heavy model for complex tasks (deep analysis, digests) — CPU-only
  # Qwen3-14B ≈ Qwen2.5-32B quality, ~10GB RAM
  ollama_heavy:
    base_url: "http://localhost:11434"
    model: "qwen3:14b"
    timeout_seconds: 300  # CPU inference is slow, allow 5 min
    thinking: true   # enable thinking for deeper reasoning

  # Qwen-Plus API (DashScope) — best Russian language quality ($0.40/1M input, $1.20/1M output)
  # OpenAI-compatible, 119 languages, thinking mode support
  qwen_plus:
    name: "Qwen-Plus"
    base_url: "https://dashscope-intl.aliyuncs.com/compatible-mode"
    api_key: "${DASHSCOPE_API_KEY}"
    model: "qwen-plus"
    max_tokens: 4096
    timeout_seconds: 120

  # DeepSeek API — cheapest external provider ($0.28/1M input, $0.42/1M output)
  # OpenAI-compatible API, automatic prefix caching
  deepseek:
    name: "DeepSeek"
    base_url: "https://api.deepseek.com"
    api_key: "${DEEPSEEK_API_KEY}"
    model: "deepseek-chat"
    max_tokens: 4096
    timeout_seconds: 120

  # Claude API — highest quality, most expensive (use sparingly)
  claude:
    api_key: "${CLAUDE_API_KEY}"
    model: "claude-sonnet-4-20250514"
    max_tokens: 4096

  # Additional OpenAI-compatible providers (OpenRouter, local vLLM, etc.)
  # extra_providers:
  #   - name: "OpenRouter"
  #     base_url: "https://openrouter.ai/api"
  #     api_key: "${OPENROUTER_API_KEY}"
  #     model: "meta-llama/llama-3.1-70b-instruct"
  #     max_tokens: 4096
  #     timeout_seconds: 120

collector:
  # How often to poll RSS feeds (Telegram is push-based)
  rss_poll_interval: "5m"
  # Deduplication window
  dedup_window: "24h"
  # Max items to process per batch
  batch_size: 50

analyzer:
  # Workers processing the analysis queue
  workers: 4
  # Max time to wait for LLM response
  llm_timeout: "30s"

alerts:
  # Check for new alerts every N seconds
  check_interval: "30s"
  # Severity thresholds for different urgency
  critical_sentiment_threshold: 0.8
  urgent_sentiment_threshold: 0.6

api:
  host: "0.0.0.0"
  port: 8080
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:5173"

moex:
  base_url: "https://iss.moex.com/iss"
  request_timeout: "10s"
  rate_limit_per_second: 5
