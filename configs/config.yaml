# MarketPulse_RU Configuration

app:
  name: "MarketPulse_RU"
  env: "development"  # development, production
  log_level: "info"   # debug, info, warn, error

database:
  host: "localhost"
  port: 5432
  user: "marketpulse"
  password: "marketpulse"
  name: "marketpulse"
  sslmode: "disable"
  max_open_conns: 25
  max_idle_conns: 5

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

telegram:
  # Telegram MTProto credentials (from https://my.telegram.org)
  api_id: 0
  api_hash: ""
  phone: ""
  # Channels to monitor
  channels:
    - "@smartlabnews"
    - "@markettwits"
    - "@moex_news"
    - "@cbr_news"
    - "@interfax_news"
    - "@raborbc"
    - "@vedomosti"
    - "@forbes_russia"
  # Bot token for sending alerts
  bot_token: ""
  alert_chat_id: 0

llm:
  ollama:
    base_url: "http://localhost:11434"
    model: "qwen2.5:7b"
    timeout_seconds: 60
  claude:
    api_key: ""
    model: "claude-sonnet-4-20250514"
    max_tokens: 4096
    # Tasks that go to Claude instead of Ollama
    deep_analysis: true
    daily_digest: true

collector:
  # How often to poll RSS feeds (Telegram is push-based)
  rss_poll_interval: "5m"
  # Deduplication window
  dedup_window: "24h"
  # Max items to process per batch
  batch_size: 50

analyzer:
  # Workers processing the analysis queue
  workers: 4
  # Max time to wait for LLM response
  llm_timeout: "30s"

alerts:
  # Check for new alerts every N seconds
  check_interval: "30s"
  # Severity thresholds for different urgency
  critical_sentiment_threshold: 0.8
  urgent_sentiment_threshold: 0.6

api:
  host: "0.0.0.0"
  port: 8080
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:5173"

moex:
  base_url: "https://iss.moex.com/iss"
  request_timeout: "10s"
  rate_limit_per_second: 5
