# MarketPulse_RU Configuration

app:
  name: "MarketPulse_RU"
  env: "development"  # development, production
  log_level: "info"   # debug, info, warn, error

database:
  host: "localhost"
  port: 5432
  user: "marketpulse"
  password: "marketpulse"
  name: "marketpulse"
  sslmode: "disable"
  max_open_conns: 10
  max_idle_conns: 3

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

telegram:
  # MTProto userbot credentials (from https://my.telegram.org)
  # The userbot subscribes to public channels as a regular user
  api_id: ${TELEGRAM_API_ID}
  api_hash: "${TELEGRAM_API_HASH}"
  phone: "${TELEGRAM_PHONE}"
  # Channels to monitor (userbot joins them automatically)
  channels:
    - "@smartlabnews"
    - "@markettwits"
    - "@Bondholders"
    - "@ifax_go"
    - "@interfaxonline"
    - "@rbc_news"
    - "@vedomosti"
    - "@forbesrussia"
    - "@harmfulinvestor"
    - "@tass_agency"
    - "@kommersant"
    - "@prime1"
    - "@newssmartlab"
    - "@izvestia"
  # Bot token for SENDING alerts (separate from userbot)
  bot_token: "${TELEGRAM_BOT_TOKEN}"
  alert_chat_id: ${TELEGRAM_ALERT_CHAT_ID:-0}

llm:
  # Fast model for routine tasks (classify, NER, sentiment) — ~80% of load
  # Qwen3-8B: ~2x faster than 14b on CPU, enough quality for classification
  ollama:
    base_url: "http://localhost:11434"
    model: "qwen3:8b"
    timeout_seconds: 120
    thinking: false  # disable thinking for fast JSON extraction

  # Heavy model — participates in batch round-robin alongside API providers
  # Ollama auto-unloads unused models, so no extra RAM in standard mode
  ollama_heavy:
    base_url: "http://localhost:11434"
    model: "qwen3:14b"
    timeout_seconds: 300
    thinking: false  # thinking off for batch classification speed

  # Qwen3-Max (DashScope) — primary heavy model, FREE quota 1M tokens
  # Strongest Qwen model, used first until free quota runs out
  qwen_plus:
    name: "Qwen3-Max"
    base_url: "https://dashscope-intl.aliyuncs.com/compatible-mode"
    api_key: "${DASHSCOPE_API_KEY}"
    model: "qwen3-max"
    max_tokens: 4096
    timeout_seconds: 120

  # DeepSeek API — last resort backup ($0.27/1M input, $1.10/1M output)
  deepseek:
    name: "DeepSeek"
    base_url: "https://api.deepseek.com"
    api_key: "${DEEPSEEK_API_KEY}"
    model: "deepseek-chat"
    max_tokens: 4096
    timeout_seconds: 120

  # Claude API disabled
  claude:
    api_key: ""
    model: ""

  # Fallback chain: qwen3-max (free) → qwen-plus (paid) → deepseek (backup)
  # When qwen3-max free quota exhausted → qwen-plus picks up (disable Free Quota Only for it)
  extra_providers:
    - name: "Qwen-Plus-Paid"
      base_url: "https://dashscope-intl.aliyuncs.com/compatible-mode"
      api_key: "${DASHSCOPE_API_KEY}"
      model: "qwen-plus"
      max_tokens: 4096
      timeout_seconds: 120

collector:
  # How often to poll RSS feeds (Telegram is push-based)
  rss_poll_interval: "5m"
  # Deduplication window
  dedup_window: "24h"
  # Max items to process per batch
  batch_size: 50

analyzer:
  # Workers processing the analysis queue
  workers: 2  # CPU-bound Ollama serializes requests; more workers just cause timeouts
  # Max time to wait for LLM response
  llm_timeout: "30s"

alerts:
  # Check for new alerts every N seconds
  check_interval: "30s"
  # Severity thresholds for different urgency
  critical_sentiment_threshold: 0.8
  urgent_sentiment_threshold: 0.6

api:
  host: "0.0.0.0"
  port: 8080
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:5173"

moex:
  base_url: "https://iss.moex.com/iss"
  request_timeout: "10s"
  rate_limit_per_second: 5
  # Passport credentials for order book access (register at https://passport.moex.com)
  passport_login: "${MOEX_PASSPORT_LOGIN}"
  passport_password: "${MOEX_PASSPORT_PASSWORD}"

# =====================================================
# Monitoring — full market universe
# =====================================================
# The system monitors ALL companies/commodities in the DB for:
# news impacts, heat scores, candle data, sector analysis.
# This is SEPARATE from trading (which uses a subset).
monitoring:
  # "all" = load every ticker from companies table (~50+)
  # "custom" = only monitor the tickers listed below
  universe: "all"
  # custom_tickers:  # only used if universe=custom
  #   - "SBER"
  #   - "GAZP"
  candle_days_back: 365  # 1 year of daily candles for the full universe

# =====================================================
# Trading System Configuration
# =====================================================
# Trading operates on a SUBSET of the monitored universe.
# The system dynamically ranks tickers by signal strength
# and trades the top-N (max_positions).
trading:
  mode: "combined"

  # Max active positions. Engine selects top-N from universe by signal strength.
  max_positions: 10

  # Explicit tickers override (optional).
  # If set, ONLY these tickers are traded (no dynamic selection).
  # If empty, dynamic selection from the full universe is used.
  # tickers:
  #   - "SBER"
  #   - "GAZP"

  # How often to check signals (TA mode)
  check_interval: "5m"

  # Dry run mode: simulate trades without real execution
  dry_run: true

  # Starting capital for position sizing (RUB)
  initial_cash: 50000

  # Risk management
  risk:
    max_position_size: 0.05    # max 5% per trade
    max_exposure: 0.50          # max 50% of portfolio in positions
    max_sector_exposure: 0.20   # max 20% in one sector
    daily_loss_limit: 0.02      # stop trading after 2% daily loss
    default_stop_loss: 0.03     # 3% stop-loss
    default_take_profit: 0.06   # 6% take-profit (2:1 ratio)
    max_open_positions: 10
    max_drawdown: 0.10          # 10% max drawdown circuit breaker

  # Strategy parameters
  strategy:
    news_weight: 0.6
    ta_weight: 0.4
    min_signal_strength: 0.3
    require_confluence: false   # set true to require both news + TA agree
    timeframes:
      - "1h"
      - "1d"
    indicator_weights:
      ma: 0.15
      rsi: 0.15
      macd: 0.15
      bollinger: 0.10
      adx: 0.10
      stochastic: 0.10
      patterns: 0.15
      volume: 0.10
