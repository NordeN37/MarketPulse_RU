<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarketPulse RU — Аналитика российского рынка</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Gridstack CSS -->
    <link href="https://cdn.jsdelivr.net/npm/gridstack@10/dist/gridstack.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/gridstack@10/dist/gridstack-extra.min.css" rel="stylesheet">
    <!-- Custom styles -->
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <div id="app">
        <div class="d-flex">
            <!-- Sidebar -->
            <nav class="mp-sidebar d-flex flex-column flex-shrink-0" :class="{ 'mp-sidebar--collapsed': sidebarCollapsed }">
                <div class="mp-sidebar__brand d-flex align-items-center px-3 py-3">
                    <i class="bi bi-graph-up-arrow fs-4 text-accent me-2"></i>
                    <span class="mp-sidebar__title" v-show="!sidebarCollapsed">MarketPulse<span class="text-muted">_RU</span></span>
                </div>

                <button class="btn btn-sm btn-outline-secondary d-md-none mx-3 mb-2" @click="sidebarCollapsed = !sidebarCollapsed">
                    <i class="bi" :class="sidebarCollapsed ? 'bi-list' : 'bi-x-lg'"></i>
                </button>

                <ul class="nav nav-pills flex-column mb-auto px-2">
                    <li class="nav-item" v-for="link in navLinks" :key="link.path">
                        <router-link
                            :to="link.path"
                            class="nav-link mp-nav-link d-flex align-items-center"
                            :class="{ active: isActive(link.path) }"
                            @click="sidebarCollapsed = true"
                        >
                            <i class="bi me-2" :class="link.icon"></i>
                            <span v-show="!sidebarCollapsed || windowWidth >= 768">{{ link.label }}</span>
                        </router-link>
                    </li>
                </ul>

                <div class="px-3 py-3 mt-auto mp-sidebar__footer" v-show="!sidebarCollapsed || windowWidth >= 768">
                    <small class="text-muted d-block">
                        <i class="bi bi-circle-fill me-1" :class="apiOnline ? 'text-success' : 'text-danger'" style="font-size: 0.5rem;"></i>
                        {{ apiOnline ? 'API онлайн' : 'API недоступен' }}
                    </small>
                </div>
            </nav>

            <!-- Main content -->
            <main class="mp-main flex-grow-1">
                <div class="mp-topbar d-flex align-items-center justify-content-between px-3 py-2 d-md-none">
                    <button class="btn btn-sm btn-outline-secondary" @click="sidebarCollapsed = !sidebarCollapsed">
                        <i class="bi bi-list"></i>
                    </button>
                    <span class="fw-bold"><i class="bi bi-graph-up-arrow text-accent me-1"></i> MarketPulse_RU</span>
                    <span></span>
                </div>
                <router-view></router-view>
            </main>
        </div>
    </div>

    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <!-- Vue Router 4 -->
    <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.prod.js"></script>
    <!-- TradingView Lightweight Charts -->
    <script src="https://unpkg.com/lightweight-charts@4/dist/lightweight-charts.standalone.production.js"></script>
    <!-- Gridstack -->
    <script src="https://cdn.jsdelivr.net/npm/gridstack@10/dist/gridstack-all.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- App scripts -->
    <script src="/js/api.js"></script>
    <script src="/js/pages/dashboard.js"></script>
    <script src="/js/pages/stocks.js"></script>
    <script src="/js/pages/stock-detail.js"></script>
    <script src="/js/pages/portfolios.js"></script>
    <script src="/js/pages/signals.js"></script>
    <script src="/js/pages/news.js"></script>
    <script src="/js/pages/settings.js"></script>
    <script src="/js/pages/llm-stats.js"></script>
    <script src="/js/pages/orderbook.js"></script>
    <script src="/js/pages/tinvest.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
